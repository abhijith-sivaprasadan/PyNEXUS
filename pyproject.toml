[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynexus-energy"
version = "0.1.0"
description = "Pyomo model for offshore-wind, PEM-electrolyser, and hydrogen-pipeline dispatch"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyomo>=6.6",
  "highspy>=1.5",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["entsoe-py>=0.6", "cdsapi>=0.6", "xarray>=2023.1", "cfgrib>=0.9"]

[tool.setuptools.packages.find]
include = ["assets*", "components*", "optimization*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
