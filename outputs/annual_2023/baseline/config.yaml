# ============================================================
# hydrogen-electricity-network — Annual (8,760h) Configuration
# ============================================================
# Same as config.yaml, but the full-year horizon actually run for
# Phase C5/A/B (see docs/reproducibility.md's 2023 annual-run section
# and docs/validation.md). Added only after that run succeeded, per
# REVAMP_PLAN.md's own instruction — this file did not exist before then.
# All physical, economic, and simulation parameters live here.
# No hardcoded constants in source files — always reference config.
# ============================================================

# --- Simulation settings ------------------------------------
simulation:
  time_horizon_hours: 8760       # full year (365 days x 24h); config.yaml's 168h is the weekly default
  time_step_hours: 1             # Hourly resolution
  start_date: "2023-01-01"       # ISO format
  timezone: "Europe/Amsterdam"   # TNO is Netherlands-based

# --- Geographic location ------------------------------------
# Used for ERA5 data fetching and solar/wind resource estimation
location:
  name: "North Sea / Netherlands"
  latitude: 52.5                 # Approx. offshore North Sea
  longitude: 3.5
  era5_grid_resolution: 0.25    # degrees (ERA5 native resolution)

# --- Electrolyzer (PEM) -------------------------------------
# Source: IRENA 2020 / Nel Hydrogen datasheet references
electrolyzer:
  rated_power_mw: 100.0          # Nameplate electrical input
  min_load_fraction: 0.10        # Minimum stable operating point (10%)
  max_load_fraction: 1.00        # Maximum load (100%)
  nominal_efficiency: 0.70       # kWh_H2 / kWh_elec at nominal load (LHV basis)
  startup_time_minutes: 5        # Cold start ramp time (PEM advantage)
  ramp_rate_per_hour: 0.40   # 40% of rated per hour — for hourly dispatch
  hydrogen_output_pressure_bar: 30.0   # Outlet pressure
  degradation_rate_per_year: 0.005     # 0.5% efficiency loss per year
  recoverable_heat_fraction: 0.5       # PEM stack coolant 50-80C -> low-grade heat use only (Phase B1)

# --- Wind turbine -------------------------------------------
# Generic offshore wind turbine (representative of North Sea assets)
wind_turbine:
  rated_power_mw: 15.0           # Single turbine (e.g. Vestas V236 class)
  n_turbines: 10                 # Farm: 150 MW total
  hub_height_m: 120.0
  cut_in_wind_speed_ms: 3.0      # Below this: zero output
  rated_wind_speed_ms: 13.0      # Full power above this
  cut_out_wind_speed_ms: 25.0    # Safety shutdown above this
  power_curve_model: "cubic"     # "cubic" (P ~ v^3) or "tabulated" (see power_curve_csv)
  power_curve_csv: null          # required if power_curve_model: "tabulated"
  wake_loss_fraction: 0.10       # downstream turbines see less wind; DNV GL / Orsted benchmarks
  electrical_loss_fraction: 0.02 # array cabling, transformers, export link; DNV-RP-0164
  unavailability_fraction: 0.05  # planned/unplanned O&M downtime; modern offshore benchmark

# --- Hydrogen pipeline ---------------------------------------
# Simplified single pipeline from electrolyzer to demand node
pipeline:
  length_km: 50.0
  diameter_m: 0.5
  roughness_mm: 0.046            # Steel pipe (Moody chart standard)
  inlet_pressure_bar: 30.0       # Matches electrolyzer outlet
  min_outlet_pressure_bar: 20.0  # Minimum delivery pressure
  max_flow_kg_per_s: 2.0         # Physical capacity constraint

# --- Hydrogen demand ----------------------------------------
hydrogen_demand:
  daily_average_kg: 50000        # ~50 tonnes/day industrial demand
  demand_profile: "flat"         # Options: flat, industrial_pattern

# --- Hydrogen storage (Phase A1, opt-in: optimize(enable_storage=True)) ----
hydrogen_storage:
  capacity_kg: 20000              # ~10h of average demand; a smoothing buffer, not a project design
  max_charge_rate_kg_h: 2200      # ~= electrolyzer max production rate at full load
  max_discharge_rate_kg_h: 2200   # ~= hourly demand rate
  initial_level_kg: 10000         # half full at horizon start
  final_level_min_kg: 10000       # terminal condition: must not be lower than this at horizon end
  loss_fraction_per_hour: 0.0001  # compressed gaseous H2 (30 bar, not cryogenic): small leakage estimate

# --- Electricity network ------------------------------------
electricity_network:
  n_buses: 5
  base_voltage_kv: 110.0         # Transmission level
  base_mva: 100.0
  load_profile: "entso_e"        # Use real ENTSO-E data

# --- Grid import/export (Phase A2, opt-in: optimize(enable_grid=True)) -----
grid:
  connection_capacity_mw: 50.0   # partial grid connection alongside the wind farm

# --- Heat storage (Phase B2, opt-in: optimize(enable_heat=True)) -----------
heat_storage:
  capacity_mwh_th: 50.0
  max_charge_rate_mw_th: 10.0
  max_discharge_rate_mw_th: 10.0
  initial_level_mwh_th: 25.0
  final_level_min_mwh_th: 25.0
  loss_fraction_per_hour: 0.01   # insulated hot-water/thermal store: illustrative standing loss

# --- Backup boiler (Phase B2, opt-in: optimize(enable_heat=True)) ----------
boiler:
  max_output_mw_th: 20.0
  fuel_cost_eur_per_mwh_th: 40.0             # natural gas backup, illustrative
  emission_factor_kg_co2_per_mwh_th: 200.0   # natural gas combustion, illustrative

# --- Economics ----------------------------------------------
economics:
  electricity_price_source: "entso_e"   # Real day-ahead prices
  currency: "EUR"
  electrolyzer_capex_per_kw: 800        # EUR/kW (2023 estimate)
  electrolyzer_opex_fraction: 0.02      # 2% of CAPEX per year
  wind_capex_per_kw: 2500               # EUR/kW offshore
  hydrogen_value_per_kg: 4.0            # EUR/kg green hydrogen
  heat_value_per_mwh: 30.0              # EUR/MWh-th, illustrative district-heating value (Phase B3)

# --- Optimization -------------------------------------------
optimization:
  objective: "minimize_cost"     # Options: minimize_cost, minimize_emissions
  solver: "highs"                # Free solver — no license needed
  time_limit_seconds: 300
  mip_gap: 0.01                  # 1% optimality gap acceptable
