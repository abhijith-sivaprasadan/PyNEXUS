name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Scientific reference smoke test
        run: |
          pynexus solve --config configs/tiny_test.yaml --synthetic --output .ci-output
          pynexus verify --run .ci-output
