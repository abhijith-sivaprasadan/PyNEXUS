name: WP5 evidence and market-price readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wp5-completion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    name: Strict UTC prices and economic claims tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q tests/test_research_wp5_market.py tests/test_research_wp5_thresholds.py tests/test_research_financial_accounting.py
  verify_original:
    runs-on: ubuntu-latest
    needs: unit
    name: Audit original 17-case archive and calculate marginal thresholds
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: wp2-2023-17-case-study
          run-id: 40148299968
          github-token: ${{ github.token }}
          path: wp5-original-source
      - run: python -m research.wp5_thresholds --wp2-dir wp5-original-source --output wp5-threshold-results
      - uses: actions/upload-artifact@v4
        with:
          name: wp5-audited-synthetic-price-marginal-thresholds
          path: wp5-threshold-results/
          if-no-files-found: error
          retention-days: 60
